# 在 Ubuntu / Windows / macOS 跑測試（CI 沒有攝影機與 GPU；需要相機的部分以合成資料與回放測試）
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Linux 系統套件（Qt offscreen 與 MediaPipe 需要）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libxkbcommon0 libfontconfig1 libdbus-1-3

      # 依 uv.lock 安裝（--locked：lock 檔與 pyproject.toml 不一致時直接失敗）；
      # CI 沒有 GPU，Linux / Windows 用 CPU 版 PyTorch，避免下載 CUDA 版
      - name: 安裝套件（Linux / Windows）
        if: runner.os != 'macOS'
        run: uv sync --locked --extra cpu

      - name: 安裝套件（macOS）
        if: runner.os == 'macOS'
        run: uv sync --locked

      - name: 模型快取
        uses: actions/cache@v4
        with:
          path: |
            models
            tests/data
          key: models-v1-${{ hashFiles('tools/download_models.py') }}

      - name: 下載模型
        run: uv run --no-sync python tools/download_models.py

      - name: 測試
        run: uv run --no-sync python -m unittest discover -s tests -v
